<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MortyShop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background">

        <header class="header">
            <div>
                <a href="">
                    <img src="images/Logo.png" alt="Логотип магазина МортиШоп" class="logo">
                </a>
            </div>
            <nav class="header_buttons">
                Каталог
                Контакты
            </nav>
        </header>

        <section class="hero_section">
            <h1>
                Почему мы?
            </h1>
            <h2>
                Мы предлагаем самый большой выбор Морти для Риков всех вселенных!
            </h2>
            <a href="#catalog" class="catalog_button">Выбрать Морти</a>
        </section>

        <section class="morty_cards_section" id="catalog">
            <section class="morty_card">
                <h3>Классический Морти</h3>
                <img src="images/Mortys/Morty.webp" alt="">
            </section>

            <section class="morty_card">
                <h3>Пугающий Морти</h3>
                <img src="images/Mortys/Spoooky_Morty.webp" alt="">
            </section>

            <section class="morty_card">
                <h3>Николай Анатольевич Морти</h3>
                <img src="images/Mortys/NikolayAnatolievichMorty.png" alt="">
            </section>

            <section class="morty_card">
                <h3>Морти с носком</h3>
                <img src="images/Mortys/Scruffy_Morty.webp" alt="">
            </section>
        </section>

        <footer class="footer">
            Учебный проект
        </footer>
    </div>
</body>
</html>
