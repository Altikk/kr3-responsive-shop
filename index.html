<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MortyShop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section class="background">
        <header class="header">
            <div>
                <a href="">
                    <img src="images/logo.jpg" alt="Логотип магазина МортиШоп" class="logo">
                </a>
            </div>
            <nav class="header_buttons">
                Каталог
                Контакты
            </nav>
        </header>
        <section class="hero_section">
            <h1>
                Почему мы?
            </h1>
            <h2>
                Мы предлагаем самый большой выбор Морти для Риков всех вселенных!
            </h2>
            <section class="morty_cards_section">
                <section class="morty_card">
                    <h3>Классический Морти</h3>
                    <img src="images/Mortys/Morty.webp" alt="">
                </section>

                <section class="morty_card">
                    <h3>Морти с куклой</h3>
                    <img src="images/Mortys/MortyPuppetMortyFront.png" alt="">
                </section>

                <section class="morty_card">
                    <h3>Пугающий Морти</h3>
                    <img src="images/Mortys/Spoooky_Morty.webp" alt="">
                </section>

                
            </section>
        </section>
        <footer class="footer">
            Учебный проект
        </footer>
    </section>
</body>
</html>
