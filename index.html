<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="МортиШоп — магазин Морти для Риков всех вселенных">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MortyShop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background">

        <header class="header">
            <div>
                <a href="">
                    <img src="images/Logo.png" alt="Логотип магазина МортиШоп" class="logo">
                </a>
            </div>
            <nav class="header_buttons">
                Каталог
                Контакты
            </nav>
        </header>

        <main>
            <section class="hero_section">
                <h1>
                    Почему мы?
                </h1>
                <h2>
                    Мы предлагаем самый большой выбор Морти для Риков всех вселенных!
                </h2>
                <a href="#catalog" class="catalog_button">Выбрать Морти</a>
            </section>

            <section class="morty_cards_section" id="catalog">
                <article class="morty_card">
                    <h3>Классический Морти</h3>
                    <img src="images/Mortys/Morty.webp" alt="Классический Морти в желтой футболке">
                </article>

                <article class="morty_card">
                    <h3>Пугающий Морти</h3>
                    <img src="images/Mortys/Spoooky_Morty.webp" alt="Классический Морти накрытый простыней с отверстиями для глаз">
                </article>

                <article class="morty_card">
                    <h3>Николай Анатольевич Морти</h3>
                    <img src="images/Mortys/NikolayAnatolievichMorty.png" alt="Николай Анатольевич Морти">
                </article>

                <article class="morty_card">
                    <h3>Грязный Морти</h3>
                    <img src="images/Mortys/Scruffy_Morty.webp" alt="Морти в плохом внешнем виде">
                </article>
            </section>
        </main>

        <footer class="footer">
            <a href="">Каталог</a>
            <a href="">Контакты</a>
            Учебный проект выполнен в рамках дисциплины "Фронтенд и бэкенд разбработка"
        </footer>
    </div>
</body>
</html>
